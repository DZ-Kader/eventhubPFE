version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: eventoria-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - eventoria-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventoria-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/eventoria
      - JWT_SECRET=eventoria_jwt_pfe_secret_key_2025
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongodb
    networks:
      - eventoria-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eventoria-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - eventoria-network

networks:
  eventoria-network:
    driver: bridge

volumes:
  mongo-data:
